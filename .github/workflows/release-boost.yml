name: Build and prepare Boost for iOS

on:
  workflow_dispatch:
    inputs:
      boost_version:
        description: Boost version to build
        required: true
        default: 1.89.0
        type: string
      operation:
        description: Validate only, or commit the final checksum and preserve release artifacts
        required: true
        default: validate
        type: choice
        options:
          - validate
          - prepare
  push:
    branches:
      - master

permissions:
  actions: write
  contents: write

concurrency:
  group: boost-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Intel is required for the x86_64 Simulator slice in these legacy releases.
    runs-on: macos-15-intel
    env:
      # Master validates the newest supported version. A manual prepare run
      # preserves the tested binaries and commits their exact SwiftPM checksum.
      BOOST_VERSION: ${{ inputs.boost_version || '1.89.0' }}
      IOS_MIN_VERSION: "12.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate supported release
        run: case "$BOOST_VERSION" in 1.61.0|1.62.0|1.63.0|1.64.0|1.65.0|1.66.0|1.67.0|1.68.0|1.69.0|1.70.0|1.71.0|1.72.0|1.73.0|1.74.0|1.75.0|1.76.0|1.77.0|1.78.0|1.79.0|1.80.0|1.81.0|1.82.0|1.83.0|1.84.0|1.85.0|1.86.0|1.87.0|1.88.0|1.89.0) ;; *) exit 1 ;; esac

      - name: Build release archive
        run: |
          log="$RUNNER_TEMP/build-release.log"
          if ! ./scripts/build-boost-ios.sh >"$log" 2>&1; then
            tail -n 200 "$log"
            exit 1
          fi
          echo "Built Boost ${BOOST_VERSION} release archive."

      - name: Inspect binary
        run: |
          package="dist/ofxiOSBoost-${BOOST_VERSION}.tar.gz"
          work="$(mktemp -d)"
          tar -xzf "$package" -C "$work"
          framework="$work/ofxiOSBoost-${BOOST_VERSION}/libs/boost/ios/boost.xcframework"
          plutil -lint "$framework/Info.plist"
          device_lib="$(find "$framework" -path '*ios-arm64/libboost.a' -print -quit)"
          simulator_lib="$(find "$framework" -path '*ios-arm64_x86_64-simulator/libboost.a' -print -quit)"
          test "$(xcrun lipo -archs "$device_lib")" = "arm64"
          test "$(xcrun lipo -archs "$simulator_lib")" = "x86_64 arm64"
          if [[ "$BOOST_VERSION" == "1.65.0" || "$BOOST_VERSION" == "1.66.0" || "$BOOST_VERSION" == "1.67.0" || "$BOOST_VERSION" == "1.68.0" || "$BOOST_VERSION" == "1.69.0" || "$BOOST_VERSION" == "1.70.0" || "$BOOST_VERSION" == "1.71.0" || "$BOOST_VERSION" == "1.72.0" || "$BOOST_VERSION" == "1.73.0" || "$BOOST_VERSION" == "1.74.0" || "$BOOST_VERSION" == "1.75.0" || "$BOOST_VERSION" == "1.76.0" || "$BOOST_VERSION" == "1.77.0" || "$BOOST_VERSION" == "1.78.0" || "$BOOST_VERSION" == "1.79.0" || "$BOOST_VERSION" == "1.80.0" || "$BOOST_VERSION" == "1.81.0" || "$BOOST_VERSION" == "1.82.0" || "$BOOST_VERSION" == "1.83.0" || "$BOOST_VERSION" == "1.84.0" || "$BOOST_VERSION" == "1.85.0" || "$BOOST_VERSION" == "1.86.0" || "$BOOST_VERSION" == "1.87.0" || "$BOOST_VERSION" == "1.88.0" || "$BOOST_VERSION" == "1.89.0" ]]; then
            xcrun nm -arch arm64 -gU "$device_lib" > "$work/device-arm64.nm"
            xcrun nm -arch arm64 -gU "$simulator_lib" > "$work/simulator-arm64.nm"
            xcrun nm -arch x86_64 -gU "$simulator_lib" > "$work/simulator-x86_64.nm"
            for symbol in _make_fcontext _jump_fcontext _ontop_fcontext; do
              grep -Fq "$symbol" "$work/device-arm64.nm"
              grep -Fq "$symbol" "$work/simulator-arm64.nm"
              grep -Fq "$symbol" "$work/simulator-x86_64.nm"
            done
          fi
          if [[ "$BOOST_VERSION" == "1.85.0" || "$BOOST_VERSION" == "1.86.0" || "$BOOST_VERSION" == "1.87.0" || "$BOOST_VERSION" == "1.88.0" || "$BOOST_VERSION" == "1.89.0" ]]; then
            for symbols in "$work/device-arm64.nm" "$work/simulator-arm64.nm" "$work/simulator-x86_64.nm"; do
              grep -Fq "boost8charconv" "$symbols"
              if grep -Fqi "quadmath" "$symbols"; then
                echo "Boost.Charconv unexpectedly references libquadmath in $symbols" >&2
                exit 1
              fi
            done
          fi

      - name: Build XCFramework example
        run: |
          log="$RUNNER_TEMP/xcframework-example.log"
          if ! ./example-xcframework/build.sh \
            "dist/ofxiOSBoost-${BOOST_VERSION}.tar.gz" >"$log" 2>&1; then
            tail -n 200 "$log"
            exit 1
          fi
          echo "Validated the XCFramework example."

      - name: Run XCFramework smoke tests in iOS Simulator
        run: |
          package_dir="$RUNNER_TEMP/ofxiOSBoost-${BOOST_VERSION}"
          app_dir="$RUNNER_TEMP/ofxiOSBoost-smoke-app"
          report="$RUNNER_TEMP/ofxiOSBoost-smoke-report.txt"
          mkdir -p "$package_dir" "libs/boost/ios" "$app_dir"
          tar -xzf "dist/ofxiOSBoost-${BOOST_VERSION}.tar.gz" \
            -C "$package_dir" --strip-components=1
          ditto "$package_dir/libs/boost/ios/boost.xcframework" \
            "libs/boost/ios/boost.xcframework"

          udid="$(xcrun simctl list devices available -j | jq -r \
            '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid // empty')"
          test -n "$udid"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b

          build_log="$RUNNER_TEMP/simulator-smoke-build.log"
          if ! xcodebuild \
            -project example-xcframework/ofxiOSBoostContextExample.xcodeproj \
            -target ofxiOSBoostContextExample \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$udid" \
            CONFIGURATION_BUILD_DIR="$app_dir" \
            CODE_SIGNING_ALLOWED=NO \
            build >"$build_log" 2>&1; then
            tail -n 200 "$build_log"
            exit 1
          fi

          xcrun simctl install "$udid" \
            "$app_dir/ofxiOSBoostContextExample.app"
          container="$(xcrun simctl get_app_container "$udid" \
            org.openframeworks.ofxiOSBoostContextExample data)"
          app_report="$container/tmp/ofxiOSBoost-smoke-report.txt"
          rm -f "$app_report"
          SIMCTL_CHILD_OFXIOSBOOST_CI=1 xcrun simctl launch "$udid" \
            org.openframeworks.ofxiOSBoostContextExample

          for _ in {1..120}; do
            if [[ -s "$app_report" ]] && \
              grep -Eq '^(ALL TESTS PASSED|TESTS FAILED)$' "$app_report"; then
              break
            fi
            sleep 1
          done
          if [[ ! -s "$app_report" ]] || \
            ! grep -Eq '^(ALL TESTS PASSED|TESTS FAILED)$' "$app_report"; then
            if [[ -s "$app_report" ]]; then
              echo "Smoke test report did not reach a terminal result:" >&2
              cat "$app_report" >&2
            fi
            xcrun simctl spawn "$udid" log show --last 2m --style compact \
              --predicate 'process == "ofxiOSBoostContextExample"' | tail -n 100
            exit 1
          fi
          cp "$app_report" "$report"
          cat "$report"
          {
            echo "### Boost ${BOOST_VERSION} iOS Simulator smoke tests"
            echo '```text'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -Fq "ALL TESTS PASSED" "$report"

      - name: Build Swift package example
        run: |
          log="$RUNNER_TEMP/swift-package-example.log"
          if ! ./example-swift-package/build.sh \
            "dist/ofxiOSBoost-${BOOST_VERSION}.tar.gz" >"$log" 2>&1; then
            tail -n 200 "$log"
            exit 1
          fi
          echo "Validated the Swift package example."

      - name: Install CocoaPods
        run: |
          log="$RUNNER_TEMP/cocoapods-install.log"
          if ! sudo gem install cocoapods --no-document >"$log" 2>&1; then
            tail -n 200 "$log"
            exit 1
          fi
          echo "Installed CocoaPods."

      - name: Validate CocoaPods package
        run: |
          work="$(mktemp -d)"
          tar -xzf "dist/ofxiOSBoost-${BOOST_VERSION}.tar.gz" -C "$work"
          package="$work/ofxiOSBoost-${BOOST_VERSION}"
          cp "dist/ofxiOSBoost.podspec" "$package/ofxiOSBoost.podspec"
          cd "$package"
          log="$RUNNER_TEMP/cocoapods-lib-lint.log"
          if ! pod lib lint ofxiOSBoost.podspec --platforms=ios >"$log" 2>&1; then
            tail -n 200 "$log"
            exit 1
          fi
          echo "Validated the CocoaPods package."

      - name: Commit prepared SwiftPM checksum
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare'
        env:
          PREPARED_BY: ${{ github.actor }}
        run: |
          test "$GITHUB_REF" = "refs/heads/master"
          zip="dist/ofxiOSBoost-${BOOST_VERSION}-xcframework.zip"
          checksum="$(swift package compute-checksum "$zip")"
          grep -Fq "/releases/download/${BOOST_VERSION}/ofxiOSBoost-${BOOST_VERSION}-xcframework.zip" Package.swift
          sed -E "s/(checksum: \")[0-9a-f]{64}(\")/\1${checksum}\2/" Package.swift > "$RUNNER_TEMP/Package.swift"
          mv "$RUNNER_TEMP/Package.swift" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Package.swift; then
            git add Package.swift
            git commit -m "Finalize Boost ${BOOST_VERSION} prepared checksum [skip ci]"
          fi
          ./scripts/finalize-prepared-artifacts.sh "$BOOST_VERSION" dist
          source_sha="$(git rev-parse HEAD)"
          {
            echo "BOOST_VERSION=$BOOST_VERSION"
            echo "SOURCE_SHA=$source_sha"
            echo "XCFRAMEWORK_SHA256=$checksum"
            echo "PREPARATION_RUN_ID=$GITHUB_RUN_ID"
            echo "PREPARED_BY=$PREPARED_BY"
          } > dist/release-manifest.env
          grep -Fq "checksum: \"${checksum}\"" Package.swift
          (cd dist && shasum -a 256 -c "ofxiOSBoost-${BOOST_VERSION}-xcframework.zip.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ofxiOSBoost-${{ env.BOOST_VERSION }}
          path: |
            dist/ofxiOSBoost-${{ env.BOOST_VERSION }}.tar.gz
            dist/ofxiOSBoost-${{ env.BOOST_VERSION }}.tar.gz.sha256
            dist/ofxiOSBoost.podspec
            dist/ofxiOSBoost-${{ env.BOOST_VERSION }}-xcframework.zip
            dist/ofxiOSBoost-${{ env.BOOST_VERSION }}-xcframework.zip.sha256
            dist/release-manifest.env
          if-no-files-found: error

      - name: Push prepared checksum commit
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare'
        run: |
          remote_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin HEAD:master

      - name: Start publication from prepared artifact
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-boost.yml \
            --ref master \
            -f "boost_version=$BOOST_VERSION" \
            -f "preparation_run_id=$GITHUB_RUN_ID"
