name: Refresh historical Boost release metadata

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REFRESH-HISTORICAL-RELEASES to continue
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-historical-boost-releases
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm historical release refresh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "REFRESH-HISTORICAL-RELEASES" ]]; then
            echo "Confirmation did not match REFRESH-HISTORICAL-RELEASES." >&2
            exit 1
          fi

  refresh:
    needs: confirm
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        boost_version:
          - 1.61.0
          - 1.62.0
          - 1.63.0
          - 1.64.0
          - 1.65.0
          - 1.66.0
    runs-on: ubuntu-latest
    env:
      BOOST_VERSION: ${{ matrix.boost_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Update description and remove redundant addon assets
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          bash ./scripts/generate-release-notes.sh "$BOOST_VERSION" "$notes"
          gh release view "$BOOST_VERSION" >/dev/null
          gh release edit "$BOOST_VERSION" \
            --title "Boost ${BOOST_VERSION} for iOS" \
            --notes-file "$notes"
          for asset in \
            "ofxiOSBoost-addon-${BOOST_VERSION}.tar.gz" \
            "ofxiOSBoost-addon-${BOOST_VERSION}.tar.gz.sha256"; do
            if gh release view "$BOOST_VERSION" --json assets \
              --jq '.assets[].name' | grep -Fqx "$asset"; then
              gh release delete-asset "$BOOST_VERSION" "$asset" --yes
            fi
          done
          echo "Updated Boost ${BOOST_VERSION} metadata; canonical assets were unchanged."
